<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Course Bookings – Lisa's Lashes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="account.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&family=Allura&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo/logo.png" type="image/png">
  <link rel="stylesheet" href="header.css">
  <style>
    .bookings-content { padding: 20px; flex: 1; }
    .bookings-content h2 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 6px; }
    .bookings-subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

    .course-booking-card {
      border: 1px solid #e8e0d0;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      display: flex;
      gap: 0;
    }

    .course-booking-img {
      width: 120px;
      flex-shrink: 0;
      object-fit: cover;
      background: #f0ece4;
    }

    .course-booking-body {
      padding: 18px 20px;
      flex: 1;
    }

    .course-booking-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .course-booking-meta {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .course-booking-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .course-booking-price {
      font-size: 18px;
      font-weight: 700;
      color: #caa46a;
      font-family: 'Playfair Display', serif;
    }

    .booking-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-confirmed { background: #edfaf1; color: #27ae60; }
    .status-cancelled { background: #fdecea; color: #e74c3c; }

    .empty-bookings { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
    .empty-bookings a { color: #caa46a; font-weight: 600; text-decoration: none; }
    .bookings-loading { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

<div id="header-new"></div>
<script>
  fetch('header.html').then(r => r.text()).then(d => {
    document.getElementById('header-new').innerHTML = d;
    const s = document.createElement('script'); s.src = 'js/header-dropdown.js'; document.body.appendChild(s);
  });
</script>

<main>
  <div id="page-loading" class="auth-loading"><div class="auth-spinner"></div></div>

  <div id="profile-section" class="page" style="display:none;">
    <aside class="sidebar">
      <h3>My Account</h3>
      <div class="menu">
        <a href="account.html">Profile</a>
        <a href="account-bookings.html">My Bookings</a>
        <a href="account-orders.html">Orders</a>
        <a class="active" href="account-course-bookings.html">Courses</a>
        <a href="in-progress.html">Settings</a>
        <a id="admin-link" href="/front_admin/admin.html" style="display:none;color:#c9a84c;font-weight:600;">⚙ Admin Panel</a>
        <a href="#" onclick="doLogout(event)">Logout</a>
      </div>
    </aside>

    <section class="bookings-content">
      <h2>My Courses</h2>
      <p class="bookings-subtitle">Your course and masterclass bookings.</p>
      <div id="bookings-container" class="bookings-loading">Loading your course bookings…</div>
    </section>
  </div>
</main>

<div id="footer-new"></div>
<script>
  fetch('footer.html').then(r => r.text()).then(d => { document.getElementById('footer-new').innerHTML = d; });
</script>

<script>
  const API = 'http://localhost:3000';

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await fetch(API + '/auth/me', { credentials: 'include', cache: 'no-store' });
      if (!res.ok) { window.location.href = 'account.html'; return; }
      const user = await res.json();
      document.getElementById('page-loading').style.display  = 'none';
      document.getElementById('profile-section').style.display = 'flex';
      if (user.role === 'admin' || user.role === 'master') document.getElementById('admin-link').style.display = 'block';
      await loadBookings();
    } catch (e) { window.location.href = 'account.html'; }
  });

  async function loadBookings() {
    const container = document.getElementById('bookings-container');
    try {
      const res = await fetch(API + '/course-bookings', { credentials: 'include', cache: 'no-store' });
      if (!res.ok) throw new Error();
      const bookings = await res.json();
      renderBookings(bookings);
    } catch (e) {
      container.innerHTML = '<div style="color:#c0392b;text-align:center;padding:40px;">Could not load bookings.</div>';
    }
  }

  function renderBookings(bookings) {
    const container = document.getElementById('bookings-container');
    if (!bookings.length) {
      container.innerHTML = `
        <div class="empty-bookings">
          <div style="font-size:40px;margin-bottom:16px;">🎓</div>
          <div>You haven't booked any courses yet.</div>
          <div style="margin-top:10px;"><a href="course.html">Browse courses</a></div>
        </div>`;
      return;
    }

    container.innerHTML = bookings.map(b => {
      const c = b.course;
      const dateStr = c.date
        ? new Date(c.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
        : null;
      const timeStr = c.time_start && c.time_end ? `${c.time_start} – ${c.time_end}` : null;
      const statusClass = b.status === 'confirmed' ? 'status-confirmed' : 'status-cancelled';
      const imgSrc = c.image_path ? `/front_admin/uploads/courses/${esc(c.image_path)}` : 'assets/logo/logo.png';

      return `
        <div class="course-booking-card">
          <img class="course-booking-img" src="${imgSrc}" alt="${esc(c.title)}">
          <div class="course-booking-body">
            <div class="course-booking-title">${esc(c.title)}</div>
            ${c.instructor ? `<div class="course-booking-meta">👤 ${esc(c.instructor)}</div>` : ''}
            ${dateStr ? `<div class="course-booking-meta">📅 ${dateStr}${timeStr ? ' · ' + timeStr : ''}</div>` : ''}
            ${c.location ? `<div class="course-booking-meta">📍 ${esc(c.location)}</div>` : ''}
            <div class="course-booking-footer">
              <span class="booking-status ${statusClass}">${esc(b.status)}</span>
              <span class="course-booking-price">€${Number(c.price).toFixed(2)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function doLogout(e) {
    e.preventDefault();
    try { await fetch(API + '/auth/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
    window.location.href = 'account.html';
  }
</script>
</body>
</html>
