<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Course Bookings – Lisa's Lashes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&family=Allura&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo/logo.png" type="image/png">
  <link rel="stylesheet" href="./css/account-course-bookings.css">
  <link rel="stylesheet" href="./css/account.css">
  </head>
<body>

<div id="header-new"></div>
<script>
  fetch('header.html').then(r => r.text()).then(d => {
    document.getElementById('header-new').innerHTML = d;
    const s = document.createElement('script'); s.src = 'js/header-dropdown.js'; document.body.appendChild(s);
  });
</script>

<main>
  <div id="page-loading" class="auth-loading"><div class="auth-spinner"></div></div>

  <div id="profile-section" class="page" style="display:none;">
    <aside class="sidebar">
      <h3>My Account</h3>
      <div class="menu">
        <a href="account.html">Profile</a>
        <a href="account-bookings.html">Bookings</a>
        <a href="account-orders.html">Orders</a>
        <a class="active" href="account-course-bookings.html">Courses</a>
        <a href="account-settings.html">Settings</a>
        <a id="admin-link" href="/front_admin/admin.html" style="display:none;color:#c9a84c;font-weight:600;">⚙ Admin Panel</a>
        <a href="#" onclick="doLogout(event)">Logout</a>
      </div>
    </aside>

    <section class="bookings-content">
      <h2>My Courses</h2>
      <p class="bookings-subtitle">Your course and masterclass bookings.</p>
      <div id="bookings-container" class="bookings-loading">Loading your course bookings…</div>
    </section>
  </div>
</main>

<div id="footer-new"></div>
<script>
  fetch('footer.html').then(r => r.text()).then(d => { document.getElementById('footer-new').innerHTML = d; });
</script>

<script src="js/account-course-bookings.js"></script>
</body>
</html>
