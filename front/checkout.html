<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Checkout – Lisa’s Lashes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<link rel="stylesheet" href="checkout.css">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
<link rel="stylesheet" href="header.css">

<script>
(function () {
  const isPhone = window.matchMedia("(max-width: 600px)").matches;

  if (isPhone) {
    // защита от бесконечного редиректа
    if (!window.location.pathname.includes("checkout-mobile.html")) {
      window.location.replace("checkout-mobile.html");
    }
  }
})();
</script>
</head>

<!-- Header section -->
<body>
 <div id="header-new"></div>
  <script>
  fetch('header.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('header-new').innerHTML = data;

      const script = document.createElement('script');
      script.src = 'js/header-dropdown.js';
      document.body.appendChild(script);
    });
  </script>
<!-- End of header section -->

<div class="checkout-wrapper">

  <!-- LEFT -->
  <div class="panel-wrapper">
    <div class="panel">
      <div class="panel-title">Your details</div>

      <div class="field">
        <label>First name <span>Required</span></label>
        <input type="text" id="checkout-first">
      </div>

      <div class="field">
        <label>Last name <span>Required</span></label>
        <input type="text" id="checkout-last">
      </div>

      <div class="field">
        <label>Email address <span>Optional</span></label>
        <input type="email" id="checkout-email">
      </div>

      <div class="field">
        <label>Phone number <span>Required</span></label>
        <input type="tel" id="checkout-phone">
      </div>

      <div id="checkout-error" style="display:none;color:#c0392b;font-size:13px;margin-bottom:10px;"></div>
      <button class="confirm-btn" id="confirm-btn" onclick="placeOrder()">Place Order</button>
    </div>

    <div class="panel collapsed">Delivery</div>
    <div class="panel collapsed">Payment</div>
  </div>

  <!-- RIGHT -->
<div class="summary-wrapper">
  <div class="summary">

    <h4>Order Summary<span id="cart-count" style="color:#888;"></span></h4>
    <div id="cart-items"></div>

    <hr class="solid">

    <div class="promo">
      <input id="promo-code" type="text" placeholder="Promo code">
      <button class="apply-btn" onclick="applyPromo()">Apply</button>
    </div>
    <hr class="solid">

    <div class="total-row">
      <span>Subtotal</span>
      <span id="subtotal">€0.00</span>
    </div>

    <div class="total-row-savings">
      <span>Product Savings</span>
      <span id="savings">€0.00</span>
    </div>

    <div class="total-row-promocode" id="promo-row" style="display:none;">
      <span>Promo Code</span>
      <span id="promo-discount">€0.00</span>
    </div>

    <hr class="solid">

    <div class="total-row-final">
      <span id="total-label">Total (0 items)</span>
      <span id="total">€0.00</span>
    </div>
  </div>
  <div class="help">
    Need help? <button>Contact us!</button>
  </div>
</div>

</div>

<!-- Footer section -->
  <div id="footer-new"></div>
    <script>
      fetch('footer.html')
      .then(res => res.text())
      .then(data => {
       document.getElementById('footer-new').innerHTML = data;
      });
      </script>
<!-- End of footer section -->
<script src="js/checkout.js"></script>
  </body>
</html>
