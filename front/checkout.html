<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Checkout – Lisa’s Lashes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<link rel="stylesheet" href="checkout.css">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
<link rel="stylesheet" href="header.css">

<script>
(function () {
  const isPhone = window.matchMedia("(max-width: 600px)").matches;

  if (isPhone) {
    // защита от бесконечного редиректа
    if (!window.location.pathname.includes("checkout-mobile.html")) {
      window.location.replace("checkout-mobile.html");
    }
  }
})();
</script>
</head>

<!-- Header section -->
<body>
 <div id="header-new"></div>
  <script>
  fetch('header.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('header-new').innerHTML = data;

      const script = document.createElement('script');
      script.src = 'js/header-dropdown.js';
      document.body.appendChild(script);
    });
  </script>
<!-- End of header section -->

<div class="checkout-wrapper">

  <!-- LEFT -->
  <div class="panel-wrapper">
    <div class="panel">
      <div class="panel-title">Your details</div>

      <div class="field">
        <label>First name <span>Required</span></label>
        <input type="text">
      </div>

      <div class="field">
        <label>Last name <span>Required</span></label>
        <input type="text">
      </div>

      <div class="field">
        <label>Email address <span>Required</span></label>
        <input type="email">
      </div>

      <div class="field">
        <label>Phone number <span>Required</span></label>
        <input type="tel">
      </div>

      <button class="confirm-btn">Confirm details</button>
    </div>

    <div class="panel collapsed">Delivery</div>
    <div class="panel collapsed">Payment</div>
  </div>

  <!-- RIGHT -->
<div class="summary-wrapper">
  <div class="summary">

    <h4>Order Summary<span id="cart-count" style="color:#888;"></span></h4>
    <div id="cart-items"></div>

    <hr class="solid">

    <div class="promo">
      <input id="promo-code" type="text" placeholder="Promo code">
      <button class="apply-btn" onclick="applyPromo()">Apply</button>
    </div>
    <hr class="solid">

    <div class="total-row">
      <span>Subtotal</span>
      <span id="subtotal">€0.00</span>
    </div>

    <div class="total-row-savings">
      <span>Product Savings</span>
      <span id="savings">€0.00</span>
    </div>

    <div class="total-row-promocode" id="promo-row" style="display:none;">
      <span>Promo Code</span>
      <span id="promo-discount">€0.00</span>
    </div>

    <hr class="solid">

    <div class="total-row-final">
      <span id="total-label">Total (0 items)</span>
      <span id="total">€0.00</span>
    </div>
  </div>
  <div class="help">
    Need help? <button>Contact us!</button>
  </div>
</div>

</div>

<!-- Footer section -->
  <div id="footer-new"></div>
    <script>
      fetch('footer.html')
      .then(res => res.text())
      .then(data => {
       document.getElementById('footer-new').innerHTML = data;
      });
      </script>
<!-- End of footer section -->

  <script>
    const API       = 'http://localhost:3000';
    const ADMIN_API = '';
    let allCart    = [];
    let currentDiscountValue = 0;
    let currentDiscountType = null;

    async function loadCart() {
    try {
      const res  = await fetch(API + '/cart', {
        method: 'GET',
        credentials: 'include' 
      });

      const data = await res.json();
      allCart = data || [];
      renderCart(allCart);
    } catch (e) {
      console.error('Failed to load cart:', e);
      document.getElementById('cart-items').innerHTML =
        '<div style="text-align:center;color:var(--text-muted);padding:32px;">Failed to load cart.</div>';
    }
  }

    function renderCart(items) {
      const container = document.getElementById('cart-items');

      if (!items.length) {
        container.innerHTML = `
          <div style="text-align:center;padding:20px;">Your cart is empty.</div>`;
        return;
      }

      container.innerHTML = items.map(item => `
      <div class="summary-item">
        <img src="/front_admin/uploads/products/${item.products.path}" alt="${item.products.name}">

        <div class="cart-info">
          <div class="cart-name">
            ${item.products.name}
          </div>

          <div class="cart-qty">
            Quantity: ${item.quantity}
          </div>
        </div>

        <div class="cart-price">
          €${(Number(item.products.price) * item.quantity).toFixed(2)}
        </div>
      </div>
    `).join('');

    const subtotal = items.reduce((sum, item) => sum + Number(item.products.price) * item.quantity, 0 );
    const totalItems = items.reduce((sum, item) => sum + item.quantity, 0 );
    const savings = 0;

    let promoDiscount = 0;

    if (currentDiscountType === 'percent') {
      promoDiscount = subtotal * (currentDiscountValue / 100);
    }

    if (currentDiscountType === 'fixed') {
      promoDiscount = currentDiscountValue;
    }

    promoDiscount = Math.min(promoDiscount, subtotal);

    const total = subtotal - savings - promoDiscount;

    document.getElementById('cart-count').textContent = ` (${totalItems} items)`;

    document.getElementById('subtotal').textContent = `€${subtotal.toFixed(2)}`;

    document.getElementById('savings').textContent = `-€${savings.toFixed(2)}`;

    document.getElementById('promo-discount').textContent =`-€${promoDiscount.toFixed(2)}`;

    document.getElementById('total').textContent =`€${total.toFixed(2)}`;

    document.getElementById('total-label').textContent = `Total (${totalItems} items)`;
    
  }

  loadCart();

  async function applyPromo() {
  const code = document.getElementById('promo-code').value.trim();

  if (!code) {
    alert('Please enter a promo code');
    return;
  }

  try {
    const res = await fetch(
      `${API}/promo/validate?code=${code}`,
      {
        method: 'GET',
        credentials: 'include',
      }
    );

    const promo = await res.json();

    if (!res.ok) {
      throw new Error(promo.message || 'Invalid promo code');
    }

    currentDiscountValue = promo.discountValue;
    currentDiscountType = promo.discountType;

    document.getElementById('promo-row').style.display = 'flex';

    renderCart(allCart);

    console.log('Promo applied:', promo);
  } catch (err) {
    console.error(err);
    alert(err.message || 'Promo code not found');
  }
}
</script>
</body>
</html>
