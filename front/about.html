<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us | Lisa's Lashes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/about.css">
  <link rel="icon" href="assets/logo/logo.png" type="image/png">
</head>

<body>
  <!-- Header -->
  <div id="header-new"></div>
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-new').innerHTML = data;
        const script = document.createElement('script');
        script.src = 'js/header-dropdown.js';
        document.body.appendChild(script);
      });
  </script>

  <!-- About content -->
  <main class="about-page" id="about-main">
    <div style="text-align:center;padding:80px;color:#aaa;">Loading…</div>
  </main>

  <!-- Footer -->
  <div id="footer-new"></div>
<script src="js/footer-loader.js"></script>
  <script src="js/about.js"></script>

  <!-- Scroll-reveal observer — fires after about.js renders sections -->
  <script>
  (function () {
    function initReveal() {
     const sections = document.querySelectorAll(
  '.about-intro, .about-section, .about-hero, .about-values, .about-video'
);      if (!sections.length) return;

      sections.forEach(s => s.classList.add('reveal'));

      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

        sections.forEach(s => io.observe(s));
      } else {
        sections.forEach(s => s.classList.add('visible'));
      }
    }

    // MutationObserver watches for about.js rendering into #about-main
    const target = document.getElementById('about-main');
    if (target) {
      const mo = new MutationObserver(() => {
        mo.disconnect();
        requestAnimationFrame(() => setTimeout(initReveal, 60));
      });
      mo.observe(target, { childList: true, subtree: true });
    }

    // Fallback in case content is already rendered
    window.addEventListener('load', () => setTimeout(initReveal, 300));
  })();
  </script>
</body>
</html>
