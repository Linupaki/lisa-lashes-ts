<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shop | Lisa's Lashes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/shop-mobile.css">
  <link rel="stylesheet" href="css/menu-mobile.css">
  <meta name="desktop-redirect" content="shop.html">
</head>

<body>
<div id="menu-mobile-root"></div>

<div id="header-mobile"></div>

<div class="page">
  <h1>Shop</h1>

  <!-- SEARCH & FILTER -->
  <div class="controls">
    <input type="text" id="shop-search" placeholder="Search products…">
    <select id="shop-category">
      <option value="">All categories</option>
    </select>

    <div class="price-range">
      <label>Price: <span id="price-max-label">€200</span></label>
      <input type="range" id="shop-price" min="0" max="200" value="200" step="1">
    </div>

    <button class="reset-btn" id="shop-reset-btn" type="button">Reset</button>
  </div>

  <div class="shop-results" id="shop-results"></div>

  <!-- PRODUCTS -->
  <div class="products" id="products"></div>

  <!-- SHOP THE LOOK -->
  <div class="shop-look-banner">
    <img src="assets/images/shopthelook.jpeg" alt="">
  </div>

</div>

<div id="footer-mobile"></div>
<script src="js/includes-mobile.js"></script>
<script src="js/mobile-redirect.js" defer></script>
<script src="js/menu-mobile.js"></script>
<script src="js/shop-mobile.js"></script>

</body>
</html>
