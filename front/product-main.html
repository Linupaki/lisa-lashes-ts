<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title id="page-title">Lisa’s Lashes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="product-main.css">
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
<link rel="stylesheet" href="header.css">
</head>

<body>
 <div id="header-new"></div>
  <script>
  fetch('header.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('header-new').innerHTML = data;

      const script = document.createElement('script');
      script.src = 'js/header-dropdown.js';
      document.body.appendChild(script);
    });
  </script>
<main>
  <section class="product-detail">

    <div class="pd-left">
      <h1 id="product-name">Loading Product...</h1>
      <div class="price" id="product-price">€0.00 <span>Tax included.</span></div>

      <button class="btn-outline">ADD TO CART</button>
      <button class="btn-dark">BUY NOW</button>

      <div class="thumbnails" id="product-thumbnails">
        <img id="thumb-1" src="assets/images/Main Image.png" style="width: 31%; aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
        <img id="thumb-2" src="assets/images/picture 1 for product.png" style="width: 31%; aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
        <img id="thumb-3" src="assets/images/picture 2 for product.png" style="width: 31%; aspect-ratio: 1; object-fit: cover; border-radius: 4px;">
      </div>

      <div class="rating">
        ★★★★★ <span>Based on <b>456 reviews</b></span>
      </div>
    </div>

    <div class="pd-center">
      <img id="main-product-image" src="assets/images/main product image.png" alt="Product Display" style="height: 80%; width: 100%; object-fit: cover; border-radius: 8px;"/>    
    </div>

    <div class="pd-right">
      <h3 id="product-sub-title">Product Details</h3>
      <p id="product-description">
        Retrieving detailed configurations from your product database pipeline...
      </p>

      
  </section>

  
  </main>

<div id="footer-new"></div>
<script>
  fetch('footer.html')
  .then(res => res.text())
  .then(data => {
   document.getElementById('footer-new').innerHTML = data;
  });
</script>
<script>
  const API_URL = 'http://localhost:3000'; // Points directly to your running NestJS backend instance
  let currentQty = 1;

  // Simple HTML Escaper for output safety
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Handle shopping bag item additions
  function changeQty(amount) {
    currentQty += amount;
    if (currentQty < 1) currentQty = 1;
    document.getElementById('qty-count').innerText = currentQty;
  }

  async function loadProductDetails() {
    // 1. Extract dynamic search payload parameter string values
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
      console.error('Error parsing route URL structure: Id criteria not detected.');
      document.getElementById('product-name').innerText = 'Product Not Found';
      return;
    }

    try {
    
      const res = await fetch(`${API_URL}/products/${productId}`, {
        method: 'GET',
        credentials: 'include'
      });

      if (!res.ok) {
        throw new Error(`Server returned network initialization exception status: ${res.status}`);
      }

      const product = await res.json();

      if (!product) {
        document.getElementById('product-name').innerText = 'Product Out of Stock';
        return;
      }


      document.title = `${product.name} – Lisa’s Lashes`;
      document.getElementById('product-name').innerText = product.name;
      document.getElementById('product-sub-title').innerText = product.name;
      document.getElementById('product-price').innerHTML = `€${parseFloat(product.price).toFixed(2)} <span>Tax included.</span>`;
      
      document.getElementById('product-description').innerText = product.description || 'No specific metadata configured for this product record entry.';

    
      if (product.path) {
        const fullImgUrl = `./front_admin/uploads/products/${product.path}`;
        
    
        document.getElementById('main-product-image').src = fullImgUrl;
        document.getElementById('thumb-1').src = fullImgUrl;
        document.getElementById('thumb-2').src = fullImgUrl;
        document.getElementById('thumb-3').src = fullImgUrl;
      } else {

        const fallbackLogo = 'assets/logo/logo.png';
        document.getElementById('main-product-image').src = fallbackLogo;
      }

    } catch (error) {
      console.error('Hydration process failure:', error);
      document.getElementById('product-name').innerText = 'Network error loading item';
      document.getElementById('product-description').innerText = 'Unable to maintain socket communication with server modules.';
    }
  }

  // Trigger loading script automatically upon page initialization
  document.addEventListener('DOMContentLoaded', loadProductDetails);
</script>
</body>
</html>
