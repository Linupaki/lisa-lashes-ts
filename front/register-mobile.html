<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register | Lisa's Lashes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/login-mobile.css">
  <link rel="stylesheet" href="css/menu-mobile.css">
  <meta name="desktop-redirect" content="register.html">
</head>

<body>

<div id="menu-mobile-root"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <h1>Create Account</h1>
      <p class="subtitle">Join us today. Fill in your details below.</p>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="first_name" autocomplete="name" required />
        </div>
        
        <div class="form-group">
          <label for="surname">Surname</label>
          <input type="text" id="surname" name="last_name" autocomplete="family-name" required />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="address" placeholder="anna@mail.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" placeholder="+353 87 123 4567" autocomplete="tel" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="signup">Already have an account? <a href="login-mobile.html">Sign in</a></p>

    </div>
  </div>
<script src="js/includes-mobile.js"></script>
<script src="js/mobile-redirect.js" defer></script>
<script src="js/menu-mobile.js"></script>
<script src="js/register-mobile.js"></script>
</body>
</html>
