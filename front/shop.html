<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop – Lisa’s Lashes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo/logo.png" type="image/png">
<link rel="stylesheet" href="header.css">
<script>
(function () {
  const isPhone = window.matchMedia("(max-width: 600px)").matches;

  if (isPhone) {
    // защита от бесконечного редиректа
    if (!window.location.pathname.includes("shop-mobile.html")) {
      window.location.replace("shop-mobile.html");
    }
  }
})();
</script>


</head>
<!-- Header section -->
<body>
 <div id="header-new"></div>
  <script>
  fetch('header.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById('header-new').innerHTML = data;

      const script = document.createElement('script');
      script.src = 'js/header-dropdown.js';
      document.body.appendChild(script);
    });
  </script>
<!-- End of header section -->

<main class="page">
  <h1>Shop</h1>

  <div class="controls">
    <input type="text" placeholder="Search products">
    <select>
      <option>All categories</option>
      <option>Lashes</option>
      <option>Tools</option>
      <option>Makeup</option>
    </select>
  </div>

  <div class="products" id="products"></div>

  <div class="shop-look-banner">
    <img src="assets/images/shopthelook.jpeg" alt="">
  </div>
</main>
<!-- Footer section -->
  <div id="footer-new"></div>
    <script>
      fetch('footer.html')
      .then(res => res.text())
      .then(data => {
       document.getElementById('footer-new').innerHTML = data;
      });
      </script>
<!-- End of footer section -->

  <script>
    const API       = 'http://localhost:3000';
    const ADMIN_API = '';
    let allProducts    = [];

    async function loadProducts() {
    try {
      const res  = await fetch(API + '/products', {
        method: 'GET',
        credentials: 'include' 
      });

      const data = await res.json();
      allProducts = data || [];
      renderProducts(allProducts);
    } catch (e) {
      console.error('Failed to load products:', e);
      document.getElementById('products').innerHTML =
        '<div style="text-align:center;color:var(--text-muted);padding:32px;">Failed to load products.</div>';
    }
  }

    function renderProducts(products) {
    const container = document.getElementById('products');

    container.innerHTML = products.map(p => `
      <div class="product">
        <div class="product-image">
          <img src="uploads/products/${p.path}" alt="${p.name}">
        </div>

        <h3>${p.name}</h3>
        <p>${p.description}</p>

        <div class="price">€${p.price}</div>

        <a href="product-main.html" class="add">View</a>
      </div>
    `).join('');
  }
  loadProducts();
  </script>
</body>
</html>
