<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Course Checkout | Lisa's Lashes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/course-checkout-mobile.css">
  <link rel="stylesheet" href="css/menu-mobile.css">
  <meta name="desktop-redirect" content="course-checkout.html">
</head>

<body>

<div id="menu-mobile-root"></div>

<div class="mobile">
  <div class="header">
    <button class="menu-btn" type="button">☰</button>
    <a href="index-mobile.html" class="logo-text">Lisa's Lashes</a>
    <div class="icons">
      <a href="account-mobile.html">
        <svg width="30" height="30" viewBox="0 0 44 49" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M41.75 46.75V41.75C41.75 39.0978 40.6964 36.5543 38.8211 34.6789C36.9457 32.8036 34.4022 31.75 31.75 31.75H11.75C9.09783 31.75 6.5543 32.8036 4.67893 34.6789C2.80357 36.5543 1.75 39.0978 1.75 41.75V46.75M31.75 11.75C31.75 17.2728 27.2728 21.75 21.75 21.75C16.2272 21.75 11.75 17.2728 11.75 11.75C11.75 6.22715 16.2272 1.75 21.75 1.75C27.2728 1.75 31.75 6.22715 31.75 11.75Z" stroke="black" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>

  <!-- COURSE SUMMARY -->
  <div class="card">
    <h3 id="summary-title">Course Summary</h3>

    <div id="course-loading" class="loading">Loading course details…</div>

    <div id="course-summary-block">
      <div class="course-top">
        <img id="cs-img" class="course-img" src="" alt="">
        <div class="course-top-info">
          <div id="cs-title" class="course-title">—</div>
          <div id="cs-instructor" class="course-meta"></div>
        </div>
      </div>

      <div id="cs-date" class="course-meta"></div>
      <div id="cs-location" class="course-meta"></div>
      <div id="cs-spots"></div>

      <hr class="divider">

      <div class="total-row">
        <span>Course Price</span>
        <span id="cs-price">—</span>
      </div>

      <hr class="divider">

      <div class="total-row-final">
        <span>Total</span>
        <span id="cs-total">—</span>
      </div>
    </div>
  </div>

  <!-- DETAILS -->
  <div class="card" id="details-panel">
    <h3>Your details</h3>

    <div class="field">
      <label>First name <span>Required</span></label>
      <input type="text" id="checkout-first">
    </div>

    <div class="field">
      <label>Last name <span>Required</span></label>
      <input type="text" id="checkout-last">
    </div>

    <div class="field">
      <label>Email address <span>Optional</span></label>
      <input type="email" id="checkout-email">
    </div>

    <div class="field">
      <label>Phone number <span>Required</span></label>
      <input type="tel" id="checkout-phone">
    </div>

    <div id="checkout-error"></div>
    <button class="confirm-btn" id="confirm-btn" type="button">Confirm Booking</button>
  </div>

  <!-- Already booked -->
  <div class="card" id="already-booked-panel">
    <div class="center">
      <div class="big-check">✓</div>
      <div class="ok-title">Already Booked</div>
      <div class="muted-text">You have already registered for this course.</div>
      <a class="link-btn" href="account-course-bookings-mobile.html">View Bookings</a>
    </div>
  </div>

  <!-- Success -->
  <div class="card" id="success-panel">
    <div class="center">
      <div class="big-emoji">🎓</div>
      <div class="ok-title">Booking Confirmed!</div>
      <div class="muted-text">You're booked for <strong id="success-title-text"></strong>.</div>
      <a class="link-btn" href="account-course-bookings-mobile.html">View Bookings</a>
    </div>
  </div>

  <!-- HELP -->
  <div class="help">
    <span><strong>Need help?</strong></span>
    <button id="contact-us-btn" type="button">Contact us!</button>
  </div>
</div>
<div id="footer-new" data-footer="footer-mobile.html"></div>
<script src="js/footer-loader.js"></script>
<script src="js/includes-mobile.js"></script>
<script src="js/mobile-redirect.js" defer></script>
<script src="js/menu-mobile.js"></script>
<script src="js/course-checkout-mobile.js"></script>
</body>
</html>
