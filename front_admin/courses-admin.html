<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — Lisa's Lashes Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/logo/logo.png" type="image/png">
  <style>
    .course-thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; background:#f0f0f0; }
    .course-thumb-placeholder { width:48px; height:48px; border-radius:6px; background:#f5f0e8; display:flex; align-items:center; justify-content:center; font-size:20px; }
  </style>
</head>
<body>

<div class="admin-wrapper">
  <div id="sidebar-container"></div>
  <script src="js/sidebar.js"></script>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Courses</h1></div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <div class="admin-profile">
          <div class="admin-avatar" id="admin-avatar">L</div>
          <div>
            <div class="admin-name" id="admin-name">Loading…</div>
            <div class="admin-role">Administrator</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-content">

      <div class="toolbar" style="margin-bottom:28px;">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search courses…" oninput="applyFilters()">
        </div>
        <select class="filter-select" id="filter-status" onchange="applyFilters()">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="hidden">Hidden</option>
        </select>
        <button class="btn btn-gold" style="margin-left:auto;" onclick="openAddModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Course
        </button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Date</th>
                <th>Price</th>
                <th>Spots</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="courses-tbody">
              <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ── Add/Edit Modal ── -->
<div class="modal-overlay" id="modal-course" onclick="handleOverlayClick(event,'modal-course')">
  <div class="modal" style="max-width:580px;">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-course-title">Add Course</div>
        <div class="modal-subtitle" id="modal-course-sub">Fill in the course details</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-course')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1;">
          <label>Title <span class="required">*</span></label>
          <input type="text" class="form-input" id="c-title" placeholder="e.g. Advanced Lash Masterclass">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label>Description</label>
          <textarea class="form-input" id="c-desc" rows="3" placeholder="Course description…" style="resize:vertical;"></textarea>
        </div>
        <div class="form-group">
          <label>Instructor</label>
          <input type="text" class="form-input" id="c-instructor" placeholder="e.g. Lisa O'Connor">
        </div>
        <div class="form-group">
          <label>Price (€) <span class="required">*</span></label>
          <input type="number" class="form-input" id="c-price" placeholder="e.g. 450" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" class="form-input" id="c-date">
        </div>
        <div class="form-group">
          <label>Spots Available</label>
          <input type="number" class="form-input" id="c-spots" placeholder="e.g. 8" min="1">
        </div>
        <div class="form-group">
          <label>Start Time</label>
          <input type="time" class="form-input" id="c-time-start">
        </div>
        <div class="form-group">
          <label>End Time</label>
          <input type="time" class="form-input" id="c-time-end">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label>Location</label>
          <input type="text" class="form-input" id="c-location" placeholder="e.g. Lisa's Lashes, Dublin 15">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label>Course Image</label>
          <input type="file" class="form-input" id="c-image" accept="image/*">
          <div id="c-image-preview" style="margin-top:8px;"></div>
        </div>
      </div>

      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;">Options</div>
        <div class="toggle-row">
          <div><div class="toggle-label">Certificate Included</div></div>
          <label class="toggle-switch"><input type="checkbox" id="c-certificate"><span class="toggle-slider"></span></label>
        </div>
        <div class="toggle-row">
          <div><div class="toggle-label">Active (visible on site)</div></div>
          <label class="toggle-switch"><input type="checkbox" id="c-active" checked><span class="toggle-slider"></span></label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-course')">Cancel</button>
      <button class="btn btn-gold" id="modal-course-save" onclick="saveCourse()">Save Course</button>
    </div>
  </div>
</div>

<script src="js/courses-admin.js"></script>
</body>
</html>
