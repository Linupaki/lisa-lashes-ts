<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Lisa's Lashes Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/logo/logo.png" type="image/png">
</head>
<body>

<div class="admin-wrapper">

  <div id="sidebar-container"></div>
<script src="js/sidebar.js"></script>
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Orders</h1></div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <div class="admin-profile">
          <div class="admin-avatar" id="admin-avatar">?</div>
          <div>
            <div class="admin-name" id="admin-name">Loading…</div>
            <div class="admin-role">Administrator</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-content">

      <!-- Toolbar -->
      <div class="toolbar" style="margin-bottom:28px;">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search by customer or order ID…">
        </div>
        <select class="filter-select" id="status-filter">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span id="orders-stats" style="margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:500;">
          — orders · €— revenue
        </span>
      </div>

      <!-- Orders table -->
      <div class="card" style="margin-bottom:28px;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px;">Loading orders…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ── Order Detail Modal ── -->
<div class="modal-overlay" id="modal-order" onclick="handleOverlayClick(event, 'modal-order')">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-order-title">Order #—</div>
        <div class="modal-subtitle" id="modal-order-subtitle">—</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-order')">✕</button>
    </div>
    <div class="modal-body">

      <!-- Customer info -->
      <div style="margin-bottom:20px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Customer</div>
        <div id="modal-customer-info" style="font-size:14px;line-height:1.8;color:var(--text-primary);"></div>
      </div>

      <!-- Items -->
      <div style="margin-bottom:20px;">
        <div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Items</div>
        <div id="modal-items-list"></div>
      </div>

      <!-- Total -->
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--border);margin-bottom:20px;">
        <span style="font-size:14px;font-weight:600;">Total</span>
        <span id="modal-total" style="font-size:18px;font-weight:700;color:var(--gold);font-family:'Playfair Display',serif;"></span>
      </div>

      <!-- Status update -->
      <div>
        <div style="font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Update Status</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="updateOrderStatus('pending')">Mark Pending</button>
          <button class="btn btn-gold btn-sm" onclick="updateOrderStatus('completed')">Mark Completed</button>
          <button class="btn btn-outline btn-sm" style="color:red;border-color:rgba(255,0,0,0.2);" onclick="updateOrderStatus('cancelled')">Cancel Order</button>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-order')">Close</button>
      <a id="modal-receipt-link" href="#" target="_blank" class="btn btn-outline">⬇ Download Receipt</a>
    </div>
  </div>
</div>

<script src="js/orders.js"></script>
</body>
</html>
