<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Lisa's Lashes Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/logo/logo.png" type="image/png">
</head>
<style>
  .stat-loading { opacity: 0.4; font-size: 22px; }
</style>
<body>

<div class="admin-wrapper">

  <div id="sidebar-container"></div>
<script src="js/sidebar.js"></script>
  <div class="main-content">

    <div class="topbar">
      <div class="topbar-title">
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <div class="admin-profile">
          <div class="admin-avatar" id="admin-avatar">L</div>
          <div>
            <div class="admin-name" id="admin-name">Loading…</div>
            <div class="admin-role">Administrator</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-content">

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-number stat-loading" id="stat-total">—</div>
          <div class="stat-label">Total Bookings</div>
          <div class="stat-change" id="stat-total-change">&nbsp;</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📆</div>
          <div class="stat-number stat-loading" id="stat-month">—</div>
          <div class="stat-label">This Month's Bookings</div>
          <div class="stat-change" id="stat-month-change">&nbsp;</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✨</div>
          <div class="stat-number stat-loading" id="stat-clients">—</div>
          <div class="stat-label">Total Clients</div>
          <div class="stat-change" id="stat-clients-change">&nbsp;</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🕐</div>
          <div class="stat-number stat-loading" id="stat-today">—</div>
          <div class="stat-label">Today's Appointments</div>
          <div class="stat-change" id="stat-today-change">&nbsp;</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="section-title">
            Recent Bookings
            <span></span>
          </div>
          <a href="bookings.html" class="btn btn-outline btn-sm">View all</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Client Name</th>
                <th>Resource</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="recent-tbody">
              <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div></div></div>
  <script src="js/admin.js"></script>
  </body>
</html>
