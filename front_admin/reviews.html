<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — Lisa's Lashes Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="icon" href="../assets/logo/logo.png" type="image/png">
</head>
<body>

<div class="admin-wrapper">
<div id="sidebar-container"></div>
<script src="js/sidebar.js"></script>
    <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h1>Reviews</h1></div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <div class="admin-profile">
          <div class="admin-avatar" id="admin-avatar">?</div>
          <div>
            <div class="admin-name" id="admin-name">Loading…</div>
            <div class="admin-role">Administrator</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-content">

      <div class="toolbar" style="margin-bottom:28px;">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search reviews…">
        </div>
        <select class="filter-select" id="status-filter">
          <option value="all">All Reviews</option>
          <option value="approved">Approved</option>
          <option value="pending">Pending</option>
          <option value="hidden">Hidden</option>
        </select>
        <select class="filter-select" id="rating-filter">
          <option value="all">All Ratings</option>
          <option value="5">5 Stars</option>
          <option value="4">4 Stars</option>
          <option value="3-below">3 Stars & below</option>
        </select>
        <span style="margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:500;" id="stats-counter">
          ⭐ -- average · -- reviews
        </span>
      </div>

      <div class="reviews-grid" id="reviews-container">
        <div style="text-align:center;color:var(--text-muted);padding:40px;grid-column:1/-1;">Loading store reviews context...</div>
      </div>

    </div>
  </div>
</div>
<script src="js/reviews.js"></script>
</body>
</html>
